<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INHUMANE PERVERT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* Dynamic viewport height adjusts for mobile browser UI bars */
      background-color: #8b0000;
      overflow: hidden; /* Prevents unwanted page scroll */
      font-family: Impact, "Arial Black", sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      justify-content: space-between;
    }

    .nav-link {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #000000;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: -1px;
      /* Dynamic font size: scales smoothly with viewport height while keeping all 9 items visible */
      font-size: clamp(1.2rem, 6dvh, 5rem);
      line-height: 1;
      transition: color 0.2s ease, background-color 0.2s ease;
    }

    /* Target the header/first item if you want it styled differently */
    .nav-link.header {
      color: #000000;
      opacity: 0.9;
    }

    .nav-link:hover {
      background-color: #000000;
      color: #8b0000;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="nav-link header">INHUMANE PERVERT</div>
    <a href="#" class="nav-link">CHATURBATE</a>
    <a href="#" class="nav-link">FETLIFE</a>
    <a href="#" class="nav-link">MAIL</a>
    <a href="#" class="nav-link">REDDIT</a>
    <a href="#" class="nav-link">REDGIFS</a>
    <a href="#" class="nav-link">TELEGRAM</a>
    <a href="#" class="nav-link">TWITTER</a>
    <a href="#" class="nav-link">XHAMSTER</a>
  </div>

</body>
</html>
